[metadata]
name = plover-polish-pss
version = 1.0.4
keywords = plover plover_plugin
long_description = file: README.md
long_description_content_type = text/markdown
summary = Plugin for polish steno theory PSS

[options]
zip_safe = True
setup_requires =
  setuptools >= 79.0.0
install_requires =
  plover >= 4.0.0.dev10
packages =
	plover_polish_pss

[options.entry_points]
plover.system = 
	PSS = plover_polish_pss.system
